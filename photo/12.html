<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Buzzz.RAW – Light Capture Terminal</title>

 <link rel="icon" href="https://bobateagrl.github.io/Images/tab.png" type="image/x-icon">

<meta name="twitter:card" content="summary_large_image">

<style>
body {
    background: #0a0a0a;
    color: #f700ff;
    font-family: 'JetBrains Mono', monospace;
    text-align: center;
    padding: 2rem;
    margin: 0;
}

.image-container {
    position: relative;
    max-width: 100%;
    margin: 2rem auto;
    overflow: hidden;
    border: 2px solid #f700ff;
    box-shadow: 0 0 20px rgba(247, 0, 255, 0.3);
    display: grid;  /* Add this */
}

.thumbnail {
    width: 100%;
    height: auto;
    filter: blur(20px);
    transform: scale(1.1);
    transition: opacity 0.3s ease;
    grid-area: 1/1;  /* Add this - both images occupy same grid cell */
}

.full-image {
    width: 100%;
    height: auto;  /* Let it be natural size */
    opacity: 0;
    transition: opacity 0.5s ease;
    grid-area: 1/1;  /* Add this */
}

.full-image.loaded {
    opacity: 1;
}

.thumbnail.hidden {
    opacity: 0;
}

h1 {
    color: #f700ff;
    text-shadow: 0 0 10px rgba(247, 0, 255, 0.5);
    font-size: 1.5rem;
    margin: 1rem 0;
}

.info {
    color: #888;
    font-size: 0.9rem;
    margin: 1rem 0;
}

a {
    color: #00ff41;
    text-decoration: none;
    padding: 0.5rem 1rem;
    border: 1px solid #00ff41;
    border-radius: 4px;
    display: inline-block;
    transition: all 0.3s ease;
}

a:hover {
    background: #00ff41;
    color: #0a0a0a;
    box-shadow: 0 0 15px rgba(0, 255, 65, 0.5);
}

.loading {
    color: #00ff41;
    font-size: 0.8rem;
    margin-top: 1rem;
}
</style>
</head>
<body>
<h1>Buzzz.RAW</h1>

<div class="image-container">
    <img src="/Images/photos/buzzzthumb.jpg" class="thumbnail" alt="Buzzz.RAW">
    <img data-src="/Images/photos/full/buzzz.jpg" class="full-image" alt="Buzzz.RAW">
</div>

<p class="info">"Lil guy wanted to say hi"</p>
<p class="loading" id="loading">Loading full resolution...</p>

<h2><a href="https://bobateagrl.github.io/LightCaptureTerminal.html?photo=12">← View in Gallery</a></h2>

<script>
// Progressive image loading
const fullImg = document.querySelector('.full-image');
const thumb = document.querySelector('.thumbnail');
const loading = document.getElementById('loading');

const img = new Image();
img.onload = () => {
    fullImg.src = img.src;
    fullImg.classList.add('loaded');
    setTimeout(() => {
        thumb.classList.add('hidden');
        loading.style.display = 'none';
    }, 500);
};
img.onerror = () => {
    loading.textContent = 'Failed to load full image';
    loading.style.color = '#ff4444';
};
img.src = fullImg.dataset.src;
</script>

</body>
</html>
