<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bobateagrl.github.io</title>
    <link rel="icon" href="./Images/tab.png" type="image/x-icon">
    <link href="./index2.css" rel="stylesheet">
    <link href="https://unpkg.com/nes.css/css/nes.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">
    <style>
        body {
            background-color: #1a1d20;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
    </style>
</head>

<body>
    <canvas id="background-canvas"></canvas>
    <div class="main-container">
        <div class="site-title">
            <h1 style="color: rgb(236, 85, 236);">Bobateagrl.github.io</h1>
            <p class="site-subtitle nes-text is-warning">welcome to my corner of the internet :3</p>
        </div>

        <div class="nav-grid">
            <div class="nav-item nes-container is-dark clickable" onclick="location.href='aboutme.html'">
                <img src="./Images/aboutme.png" alt="About Me" loading="lazy">
            </div>

            <div class="nav-item nes-container is-dark clickable" onclick="location.href='projectv2.html'">
                <img src="./Images/projects.png" alt="Projects" loading="lazy">
            </div>
            
            <div class="nav-item nes-container is-dark clickable">
                <a href="LightCaptureTerminal.html">
                    <img src="./Images/photos.png" alt="Photos" loading="lazy">
                </a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer style="margin-top: 3rem; text-align: center; position: relative; z-index: 10;">
        <div class="nes-balloon from-left is-dark easter-egg-hint">
            <p>30 Extra lives?</p>
        </div>
    </footer>

    <!-- P5.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>

    <!-- Interactive Background -->
    <script src="./interactive-background.js"></script>

    <!-- Page-specific interactions -->
    <script>
        // Click feedback for navigation items
        document.querySelectorAll('.nav-item.clickable').forEach(item => {
            item.addEventListener('click', function() {
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 100);
            });
        });
    </script>
</body>
</html>
