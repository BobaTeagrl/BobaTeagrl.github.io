<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Bobateagrl.github.io</title>
    <link rel="icon" href="./Images/tab.png" type="image/x-icon">
    <link href="./index.css" rel="stylesheet">
    <link href="nescss/nes.css" rel="stylesheet">
    <link href="fonts.css" rel="stylesheet">

    <!-- HTML Meta Tags -->

    <title>Bobateagrl's personal website :3</title>
    <meta name="description" content="Click and see the constantly changing mess of photos, links, rants and plenty of spaghetti code!">

    <!-- Facebook Meta Tags -->
    <meta property="og:url" content="https://bobateagrl.github.io">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Bobateagrl's personal website :3">

    <!-- Twitter Meta Tags -->

    <meta name="twitter:card" content="summary_large_image">

    <meta property="twitter:url" content="https://bobateagrl.github.io">

    <style>
        body {
            background-color: #1a1d20;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            touch-action: none;
        }

        footer {
            font-size: clamp(0.6rem, 3.5vw, 1rem);
        }
    </style>
</head>

<body>
    <canvas id="background-canvas"></canvas>
    <div class="main-container">
        <div class="site-title">
            <h1 style="color: rgb(236, 85, 236); font-size: clamp(1rem, 3.5vw, 2rem);">Bobateagrl.github.io</h1>
            <p class="site-subtitle nes-text is-warning">welcome to my corner of the internet :3</p>
        </div>

        <div class="nav-grid">
            <div class="nav-item nes-container is-dark " >
                <a href="aboutme.html">
                <img src="./Images/aboutme.png" alt="About Me" loading="lazy">
            </a>
            </div>

            <div class="nav-item nes-container is-dark " >
                <a href="projects.html">
                <img src="./Images/projects.png" alt="Projects" loading="lazy">
                 </a>
            </div>
            
            <div class="nav-item nes-container is-dark ">
                <a href="LightCaptureTerminal.html">
                    <img src="./Images/photos.png" alt="Photos" loading="lazy">
                </a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer style="margin-top: 3rem; text-align: center; position: relative; z-index: 10;">
        <div class="nes-balloon from-left is-dark easter-egg-hint">
            <p>Try typing a color</p>
        </div>
    </footer>

    <!-- P5.js Library -->
    <script src="./javascript/p5.min.js"></script>

    <!-- Interactive Background -->
    <script src="./javascript/interactive-background.js"></script>

    <!-- Page-specific interactions -->
    <script>
        // Click feedback for navigation items
        document.querySelectorAll('.nav-item.clickable').forEach(item => {
            item.addEventListener('click', function() {
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 100);
            });
        });
    </script>
</body>
</html>
